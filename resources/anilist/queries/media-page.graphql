query MediaPage($page: Int, $perPage: Int) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      currentPage
      lastPage
      hasNextPage
    }
    media {
      id
      type
      format
      status
      title {
        romaji
        english
        native
      }
      synonyms
      episodes
      chapters
      averageScore
      season
      seasonYear
      nextAiringEpisode {
        episode
        airingAt
      }
      siteUrl
      externalLinks {
        site
        url
      }
      streamingEpisodes {
        site
        url
      }
      coverImage {
        medium
        large
        extraLarge
      }
      description
    }
  }
}
